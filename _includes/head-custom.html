<!-- Color the Python code blocks of the documentation pages as the playground
     colors its editor, with the same tokenizer and palette. -->
<link rel="stylesheet" href="{{ '/playground/python-highlight.css' | relative_url }}">
<script type="module">
  import { colorize } from '{{ "/playground/python-highlight.js" | relative_url }}';
  for (const code of document.querySelectorAll('div.language-python pre code')) {
    code.innerHTML = colorize(code.textContent);
  }
</script>
