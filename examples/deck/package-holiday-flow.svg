<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">How a package holiday cancellation is decided</title>
  <desc id="desc">A cancellation request first meets the tour operator's terms. If the terms refuse it, it stops there with reasons: r7 and r8, under both rulebooks. If the terms permit it, the Package Travel Directive decides: pay the operator's cancellation fee (2015 rules r1, r2 and r4; revision r1 and r2), cancel for free with money back within 14 days (2015 rules r3 and r5; revision r3, r4 and r5), or cancel for free with a voucher (r6 in both, on agreed terms in 2015 and with guarantees under the revision).</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="960" height="580" rx="14" fill="#ffffff"/>

  <!-- start -->
  <rect x="330" y="18" width="300" height="56" rx="28" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="480" y="42" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">A traveller wants to cancel</text>
  <text x="480" y="62" text-anchor="middle" font-size="14" fill="#475569">eight requests: r1 – r8</text>

  <!-- gate 1 -->
  <line x1="480" y1="74" x2="480" y2="106" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="270" y="108" width="420" height="96" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="480" y="134" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">Gate 1 · the tour operator's terms</text>
  <text x="480" y="156" text-anchor="middle" font-size="14" fill="#1e3a8a">Is the lead traveller asking?</text>
  <text x="480" y="175" text-anchor="middle" font-size="14" fill="#1e3a8a">Is it still before departure?</text>
  <text x="480" y="194" text-anchor="middle" font-size="12" fill="#3b5bdb">written in ODRL</text>

  <!-- refused by the terms -->
  <line x1="270" y1="156" x2="238" y2="156" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="254" y="148" text-anchor="middle" font-size="12" fill="#b91c1c">no</text>
  <rect x="18" y="100" width="218" height="112" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="127" y="126" text-anchor="middle" font-size="16" font-weight="700" fill="#991b1b">Refused by the terms</text>
  <text x="127" y="146" text-anchor="middle" font-size="13" fill="#991b1b">with the reasons why</text>
  <text x="127" y="174" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">r7  r8</text>
  <text x="127" y="196" text-anchor="middle" font-size="12" fill="#991b1b">the same under both rulebooks</text>

  <!-- gate 2 -->
  <line x1="480" y1="204" x2="480" y2="244" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="494" y="230" font-size="12" fill="#15803d">yes</text>
  <rect x="270" y="246" width="420" height="84" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="480" y="272" text-anchor="middle" font-size="17" font-weight="700" fill="#4c1d95">Gate 2 · the Package Travel Directive</text>
  <text x="480" y="294" text-anchor="middle" font-size="14" fill="#4c1d95">Did something beyond anyone's control strike,</text>
  <text x="480" y="314" text-anchor="middle" font-size="14" fill="#4c1d95">at the destination or at the point of departure?</text>

  <!-- branches -->
  <line x1="420" y1="330" x2="170" y2="396" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="330" x2="480" y2="396" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="540" y1="330" x2="790" y2="396" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="262" y="352" text-anchor="middle" font-size="12" fill="#334155">no, or not where it counts</text>
  <text x="488" y="368" font-size="12" fill="#334155">yes: money back</text>
  <text x="702" y="352" text-anchor="middle" font-size="12" fill="#334155">yes: voucher accepted</text>

  <!-- outcome: fee -->
  <rect x="18" y="398" width="300" height="134" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="168" y="424" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">Pay the operator's fee</text>
  <text x="168" y="444" text-anchor="middle" font-size="13" fill="#1e293b">the rest refunded within 14 days</text>
  <text x="40" y="478" font-size="14" fill="#334155">2015 rules:</text>
  <text x="130" y="478" font-size="14" font-weight="700" fill="#0f172a">r1, r2, <tspan fill="#c2410c">r4</tspan></text>
  <text x="40" y="506" font-size="14" fill="#334155">Revision:</text>
  <text x="130" y="506" font-size="14" font-weight="700" fill="#0f172a">r1, r2</text>

  <!-- outcome: refund -->
  <rect x="330" y="398" width="300" height="134" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="480" y="424" text-anchor="middle" font-size="16" font-weight="700" fill="#14532d">Cancel for free</text>
  <text x="480" y="444" text-anchor="middle" font-size="13" fill="#14532d">full refund within 14 days</text>
  <text x="352" y="478" font-size="14" fill="#334155">2015 rules:</text>
  <text x="442" y="478" font-size="14" font-weight="700" fill="#0f172a">r3, r5</text>
  <text x="352" y="506" font-size="14" fill="#334155">Revision:</text>
  <text x="442" y="506" font-size="14" font-weight="700" fill="#0f172a">r3, <tspan fill="#c2410c">r4</tspan>, r5</text>

  <!-- outcome: voucher -->
  <rect x="642" y="398" width="300" height="134" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="792" y="424" text-anchor="middle" font-size="16" font-weight="700" fill="#78350f">Cancel for free, as a voucher</text>
  <text x="792" y="444" text-anchor="middle" font-size="13" fill="#78350f">only if the traveller accepts it</text>
  <text x="664" y="478" font-size="14" fill="#334155">2015 rules:</text>
  <text x="754" y="478" font-size="14" font-weight="700" fill="#0f172a"><tspan fill="#c2410c">r6</tspan>, on agreed terms</text>
  <text x="664" y="506" font-size="14" fill="#334155">Revision:</text>
  <text x="754" y="506" font-size="14" font-weight="700" fill="#0f172a"><tspan fill="#c2410c">r6</tspan>, full value,</text>
  <text x="754" y="524" font-size="13" fill="#0f172a">≤ 12 months, unused refunded</text>

  <text x="480" y="558" text-anchor="middle" font-size="13" fill="#475569">In orange: r4 and r6, the cancellations the revision changes. Complaint deadlines change too.</text>
</svg>
