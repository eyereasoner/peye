<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">How the research portal decides a session</title>
  <desc id="desc">A planned research session first meets the hospital's research policy. If the policy refuses it, it stops there with reasons: sessions r2 to r6 and r11, under both rulebooks. If the policy permits it, the device rules decide: go ahead with a duty to delete within 90 days (today r10; proposal r1 and r10), wait for device consent (today r1, r7, r8 and r9; proposal r9), or tracker blocked (today none; proposal r7 and r8).</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="960" height="560" rx="14" fill="#ffffff"/>

  <!-- start -->
  <rect x="330" y="18" width="300" height="56" rx="28" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="480" y="42" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">A planned research session</text>
  <text x="480" y="62" text-anchor="middle" font-size="14" fill="#475569">eleven of them: r1 – r11</text>

  <!-- gate 1 -->
  <line x1="480" y1="74" x2="480" y2="106" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="270" y="108" width="420" height="96" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="480" y="134" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">Gate 1 · the hospital's research policy</text>
  <text x="480" y="156" text-anchor="middle" font-size="14" fill="#1e3a8a">Is it research? Was consent given? Pseudonymised?</text>
  <text x="480" y="175" text-anchor="middle" font-size="14" fill="#1e3a8a">Before 2027? Not marketing, not the US partner?</text>
  <text x="480" y="194" text-anchor="middle" font-size="12" fill="#3b5bdb">written in ODRL, with DPV terms</text>

  <!-- refused by policy -->
  <line x1="270" y1="156" x2="238" y2="156" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="254" y="148" text-anchor="middle" font-size="12" fill="#b91c1c">no</text>
  <rect x="18" y="100" width="218" height="112" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="127" y="126" text-anchor="middle" font-size="16" font-weight="700" fill="#991b1b">Refused by the policy</text>
  <text x="127" y="146" text-anchor="middle" font-size="13" fill="#991b1b">with the reasons why</text>
  <text x="127" y="174" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">r2  r3  r4  r5  r6  r11</text>
  <text x="127" y="196" text-anchor="middle" font-size="12" fill="#991b1b">the same under both rulebooks</text>

  <!-- gate 2 -->
  <line x1="480" y1="204" x2="480" y2="244" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="494" y="230" font-size="12" fill="#15803d">yes</text>
  <rect x="270" y="246" width="420" height="84" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="480" y="272" text-anchor="middle" font-size="17" font-weight="700" fill="#4c1d95">Gate 2 · the device rules</text>
  <text x="480" y="294" text-anchor="middle" font-size="14" fill="#4c1d95">The session also uses a cookie or tracker.</text>
  <text x="480" y="314" text-anchor="middle" font-size="14" fill="#4c1d95">Does it need consent, and may the portal ask?</text>

  <!-- branches -->
  <line x1="420" y1="330" x2="170" y2="396" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="330" x2="480" y2="396" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="540" y1="330" x2="790" y2="396" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="262" y="352" text-anchor="middle" font-size="12" fill="#334155">no consent needed</text>
  <text x="488" y="368" font-size="12" fill="#334155">needed, may ask</text>
  <text x="702" y="352" text-anchor="middle" font-size="12" fill="#334155">needed, but the visitor said no</text>

  <!-- outcome: go ahead -->
  <rect x="18" y="398" width="300" height="122" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="168" y="424" text-anchor="middle" font-size="16" font-weight="700" fill="#14532d">Go ahead</text>
  <text x="168" y="444" text-anchor="middle" font-size="13" fill="#14532d">and delete the data within 90 days</text>
  <text x="40" y="474" font-size="14" fill="#334155">Today:</text>
  <text x="120" y="474" font-size="14" font-weight="700" fill="#0f172a">r10</text>
  <text x="40" y="500" font-size="14" fill="#334155">Proposal:</text>
  <text x="120" y="500" font-size="14" font-weight="700" fill="#0f172a"><tspan fill="#c2410c">r1</tspan>, r10</text>

  <!-- outcome: wait -->
  <rect x="330" y="398" width="300" height="122" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="480" y="424" text-anchor="middle" font-size="16" font-weight="700" fill="#78350f">Wait for device consent</text>
  <text x="480" y="444" text-anchor="middle" font-size="13" fill="#78350f">ask first; no answer yet means no</text>
  <text x="352" y="474" font-size="14" fill="#334155">Today:</text>
  <text x="432" y="474" font-size="14" font-weight="700" fill="#0f172a"><tspan fill="#c2410c">r1</tspan>, <tspan fill="#c2410c">r7</tspan>, <tspan fill="#c2410c">r8</tspan>, r9</text>
  <text x="352" y="500" font-size="14" fill="#334155">Proposal:</text>
  <text x="432" y="500" font-size="14" font-weight="700" fill="#0f172a">r9</text>

  <!-- outcome: blocked -->
  <rect x="642" y="398" width="300" height="122" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="792" y="424" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">Tracker blocked</text>
  <text x="792" y="444" text-anchor="middle" font-size="13" fill="#1e293b">browser said no, or asked too recently</text>
  <text x="664" y="474" font-size="14" fill="#334155">Today:</text>
  <text x="744" y="474" font-size="14" font-weight="700" fill="#0f172a">none</text>
  <text x="664" y="500" font-size="14" fill="#334155">Proposal:</text>
  <text x="744" y="500" font-size="14" font-weight="700" fill="#0f172a"><tspan fill="#c2410c">r7</tspan>, <tspan fill="#c2410c">r8</tspan></text>

  <text x="480" y="546" text-anchor="middle" font-size="13" fill="#475569">In orange: r1, r7 and r8, the sessions whose outcome the proposal changes.</text>
</svg>
